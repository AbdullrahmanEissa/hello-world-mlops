name: CI - Train And Save

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-and-save:
    runs-on: ubuntu-latest

    steps:
     
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      
      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      
      - name: Train model
        run: |
          python train.py

      
      - name: Generate random ID and tag model
        id: tag
        run: |
          RAND_ID=$(openssl rand -hex 4)
          echo "RANDOM_ID=${RAND_ID}" >> $GITHUB_ENV
          cp artifacts/model.pkl "artifacts/model-${RAND_ID}.pkl"

      - name: Upload model artifact
        id: artifact-upload
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ env.RANDOM_ID }}
          path: artifacts/model-${{ env.RANDOM_ID }}.pkl
          retention-days: 30

      - name: Display artifact download info
        run: |
          echo "Model saved with ID: ${{ env.RANDOM_ID }}"
          echo "Download URL: ${{ steps.artifact-upload.outputs.artifact-url }}"